[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillguard"
version = "0.1.0"
description = "Security scanner, safe install gate, and GitHub Action for AI Agent Skills (SKILL.md), .cursorrules, and MCP servers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai-security", "mcp", "agent-skills", "prompt-injection", "supply-chain", "cli", "linter"]
dependencies = [
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/an1zy/skillguard"
Repository = "https://github.com/an1zy/skillguard"

[project.scripts]
skillguard = "skillguard.cli:main"
sguard = "skillguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skillguard*"]
